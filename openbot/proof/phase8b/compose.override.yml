# Proof-only override for docker-compose.selfhosted.yml (Phase 8b).
#
# It adds NOTHING the operator recipe lacks except two loopback services that stand in for the two
# things an operator supplies in production:
#
#   model     an OpenAI-compatible endpoint (the repo's own `server/testing/llmock.ts`)
#   computer  the Bot's own browser, which a real deployment runs as `agent-computer`
#
# and published ports so the driver and the evidence reads can reach them. The companion service is
# UNCHANGED apart from those two addresses and its host port, so what the UI proofs exercise is the
# recipe's own image.
#
# Proofs 1 and 2 do not use this file: they run on the unmodified 8a recipe against the real model
# endpoint.
#
#   cd openbot
#   OPENAI_API_KEY=proof-key docker compose \
#     -f docker-compose.selfhosted.yml -f proof/phase8b/compose.override.yml \
#     -p openduet-8b up -d
name: openduet-8b

x-stub: &stub
  image: oven/bun:1.4.3
  working_dir: /repo/openbot/proof/phase8b
  environment:
    HOME: /tmp
  volumes:
    - "../../:/repo:ro"

services:
  postgres:
    ports:
      - "127.0.0.1:55442:5432"

  model:
    <<: *stub
    command: ["bun", "/repo/openbot/proof/phase8b/model-mock.ts"]
    ports:
      - "127.0.0.1:7031:7031"
      - "127.0.0.1:7032:7032"

  computer:
    <<: *stub
    command: ["bun", "/repo/openbot/proof/phase8b/computer-stub.ts"]
    ports:
      - "127.0.0.1:4231:4231"

  companion:
    environment:
      OPENAI_API_KEY: proof-key
      OPENAI_BASE_URL: http://model:7031/v1
      BOT_MODEL: proof-model
      AGENT_COMPUTER_URL: http://computer:4231
      COMPUTER_TOKEN: proof-computer-token
      WORKER_SHARED_SECRET: proof-worker-secret
      SERVER_INTERNAL_URL: http://127.0.0.1:3001
      OPENBOT_PUBLIC_URL: http://127.0.0.1:3102
      TRUSTED_ORIGINS: http://127.0.0.1:3102,http://localhost:3102
    # The host port comes from OPENBOT_PORT in the environment the stack is brought up with, so the
    # base file stays the authority on the published address.

  scheduler:
    environment:
      WORKER_SHARED_SECRET: proof-worker-secret
      SERVER_INTERNAL_URL: http://companion:3001
